[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recpack"
version = "0.3.6"
description = "Python package for Top-N recommendation based on implicit feedback data."
readme = "README.md"
requires-python = ">=3.11"
# Lower bounds for scipy, scikit-learn, pandas and torch are their first releases built against numpy 2.
# tqdm >= 4.66.1 is needed for progress_map with pandas >= 2.2.
dependencies = [
    "numpy>=2.0, ==2.*",
    "scipy>=1.13, ==1.*",
    "scikit-learn>=1.4.2, ==1.*",
    "pandas>=2.2.2, ==2.*",
    "PyYAML>=6.0.1, ==6.*",
    "torch>=2.3, ==2.*",
    "tqdm>=4.66.1, ==4.*",
    "hyperopt>=0.3.0, ==0.3.*",
]

[project.optional-dependencies]
doc = ["sphinx==4.*", "sphinx-rtd-theme==1.*"]
test = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.urls]
Homepage = "https://gitlab.com/recpack-maintainers/recpack"
Documentation = "https://recpack.froomle.ai"

[tool.hatch.build.targets.wheel]
packages = ["recpack"]
# Keep the wheel identical to the former setuptools build, which only shipped
# directories containing an __init__.py.
exclude = [
    "recpack/tests/test_algorithms/test_experimental",
    "recpack/tests/test_algorithms/test_time_aware_item_knn",
    "recpack/tests/test_datasets",
    "recpack/tests/test_metrics",
    "recpack/tests/test_pipelines",
    "recpack/tests/test_scenarios",
    # Test data for the snapshot tests, only needed when running them from a checkout.
    "recpack/tests/test_regression/snapshots.npz",
]

[tool.hatch.build.targets.sdist]
include = ["/recpack", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[tool.black]
line-length = 119
target-version = ['py311']
include = '\.pyi?$'
exclude = '''

(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
  )/
  | pyproject.toml   # also separately exclude a file named foo.py in
                     # the root of the project
)
'''

[tool.autoDocstring]
docstringFormat = "sphinx"
